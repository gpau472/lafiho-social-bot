name: Informe semanal
on:
  workflow_dispatch: {}   # pausado: la publicación se hace con Metricool. Se ejecuta solo a mano.
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Informe
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: python insights.py
      - name: Guardar informe
        run: |
          git config user.name "lafiho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A reports 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "informe semanal" && git push)
