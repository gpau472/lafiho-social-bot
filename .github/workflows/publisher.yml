name: Publicar lo aprobado
on:
  workflow_dispatch: {}   # pausado: la publicación se hace con Metricool. Se ejecuta solo a mano.
permissions:
  contents: write
concurrency:
  group: publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
        run: python publisher.py
      - name: Guardar estado
        run: |
          git config user.name "lafiho-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A schedule 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "estado de publicaciones" && git push)
